<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>International Racing League | Historical Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/favicon.png" />
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <div class="brand-badge"><img class="brand-logo" src="assets/img/irl-logo.jpg" alt="International Racing League logo" /></div>
        <span>International Racing League</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
      <nav id="main-nav" class="nav-links">
        <a href="calendar.html">Calendar</a>
        <a href="standings.html">Standings</a>
        <a href="races.html">Race Results</a>
        <a href="stewards.html">Stewarding</a>
        <a href="lineup.html">Lineup</a>
        <a href="licenses.html">Licenses</a>
        <a href="stats.html">Statistics</a>
        <a href="assistant.html">Assistant</a>
        <a href="history.html">Season History</a>
        <a href="champions.html">Champions</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <a class="button secondary" href="history.html" style="margin-bottom: 14px;">Back to Season History</a>
    <h2 id="history-race-title" class="section-title">Historical Race</h2>
    <p id="history-race-meta" class="race-meta"></p>
    <div id="history-session-tabs" class="filter-row" style="margin: 16px 0;"></div>

    <div class="table-wrapper" style="margin-top: 16px;">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th>Points</th>
            <th>Fastest Lap</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="history-results-body"></tbody>
      </table>
    </div>
  </main>

  <footer class="container">
    Historical details are loaded from <code>data/league-history.json</code>.
  </footer>

  <script type="module" src="assets/js/history-race-detail.js"></script>
</body>
</html>
